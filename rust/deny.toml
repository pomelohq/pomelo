[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser (unmaintained, not a vulnerability) comes in through glyphon > cosmic-text > fontdb and parses only the bundled UI font and installed system fonts, no fix exists; revisit by 2027-01-31 or when glyphon moves off it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[[licenses.exceptions]]
crate = "tree-sitter-gitcommit"
allow = ["WTFPL"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# Workspace crates are never published and reach each other by path, which cargo-deny counts as a wildcard.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
