# Pomelo, rewritten from scratch in Rust (cross-platform: Linux/macOS/Windows).
# A cargo workspace: `editor` is the GPU editor core (rope + tree-sitter + wgpu/glyphon),
# `app` is the winit application that will grow the pane/tab/file-tree/terminal UI.
[workspace]
resolver = "2"
members = ["crates/editor", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
wgpu = "22"
winit = "0.30"
glyphon = "0.6"
pollster = "0.3"
anyhow = "1"
bytemuck = "1"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
