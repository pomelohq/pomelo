path_suffixes = ["ex", "exs"]
line_comments = ["# "]
autoclose_before = ";:.,=}])>"
increase_indent_pattern = '\bdo\s*$|->\s*$'
decrease_indent_pattern = '^\s*(end|else|rescue|catch|after)\b'
decrease_indent_patterns = []
indent_from_last_non_blank_line = true
snippet_scope = "elixir"

[[brackets]]
start = "{"
end = "}"
close = true
surround = true
newline = true
not_in = []

[[brackets]]
start = "["
end = "]"
close = true
surround = true
newline = true
not_in = []

[[brackets]]
start = "("
end = ")"
close = true
surround = true
newline = true
not_in = []

[[brackets]]
start = '"'
end = '"'
close = true
surround = true
newline = false
not_in = ["string", "comment"]

[[brackets]]
start = "'"
end = "'"
close = true
surround = true
newline = false
not_in = ["string", "comment"]
