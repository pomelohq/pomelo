# Grammars shipped as packages instead of compiled into the app. Each one is built from the same crate
# version Cargo.lock pins (checksum and git rev verified), so the package parses exactly like the
# compiled-in grammar did, and is read with the app's own queries for that language.
#
#   language       the editor's name for it
#   crate          the grammar crate in Cargo.lock; its version is the package version
#   source         folder in the crate holding src/parser.c (default: the crate root)
#   grammar        the name its parser exports, tree_sitter_<grammar>
#   repository/rev upstream the crate was published from (rev from its .cargo_vcs_info.json)
#   license        SPDX id; license_file is in the crate, license_path is fetched from the repository at rev
#   sample         file in samples/ the package must highlight exactly like the compiled-in grammar

[csharp]
language = "C#"
crate = "tree-sitter-c-sharp"
grammar = "c_sharp"
repository = "https://github.com/tree-sitter/tree-sitter-c-sharp"
rev = "cac6d5fb595f5811a076336682d5d595ac1c9e85"
license = "MIT"
license_file = "LICENSE"
sample = "csharp.cs"

