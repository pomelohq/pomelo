# Grammars shipped as packages instead of compiled into the app. Each one is built from the crate version
# the app compiled in before (checksum and git rev verified), so the package parses exactly as that grammar
# did, and carries the queries and editing config in languages/<id>/. expected/<id>.json is what that
# compiled-in language gave for the sample; a package must give the same.
#
#   language       the editor's name for it
#   crate          the grammar crate on crates.io the package is built from
#   version        that crate's version, which is the package version
#   checksum       sha256 of the published .crate, checked before it is built
#   source         folder in the crate holding src/parser.c (default: the crate root)
#   grammar        the name its parser exports, tree_sitter_<grammar>
#   repository/rev upstream the crate was published from (rev from its .cargo_vcs_info.json)
#   license        SPDX id; license_file is in the crate, license_path is fetched from the repository at rev
#   sample         file in samples/; expected/<id>.json holds what the package must give for it

[csharp]
language = "C#"
crate = "tree-sitter-c-sharp"
version = "0.23.5"
checksum = "c1aac67f1ad71de1d6d39708d34811081c26dfa495658de6c14c34200849357c"
grammar = "c_sharp"
repository = "https://github.com/tree-sitter/tree-sitter-c-sharp"
rev = "cac6d5fb595f5811a076336682d5d595ac1c9e85"
license = "MIT"
license_file = "LICENSE"
sample = "csharp.cs"

