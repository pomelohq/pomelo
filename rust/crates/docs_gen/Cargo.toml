[package]
name = "docs_gen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Writes the reference pages of the docs site (settings, key bindings, CLI, MCP tools, languages) from the code that defines them."
publish = false

[[bin]]
name = "docs_gen"
path = "src/docs_gen.rs"

[dependencies]
editor = { package = "pomelo-editor", path = "../editor" }
grammars = { path = "../grammars" }
lsp = { path = "../lsp" }
pom_cli = { path = "../pom_cli" }
pom_mcp = { path = "../pom_mcp" }
settings = { path = "../settings" }
workspace = { path = "../workspace" }
serde_json.workspace = true
