shared_services:
  postgres:
    environment:
      POSTGRES_PASSWORD: other
  redis:
    capacity: 8
  cache:
    type: redis
  search:
    type: opensearch
  minio:
  zincsearch:
  custom:
    image: my/image
    ports: ["1234"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      retries: 2
