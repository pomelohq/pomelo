[package]
name = "pom_db"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browsing a workspace's databases: the Postgres databases, Redis instances and object storage it uses, their tables, keys and objects, queries, CSV export, and saved consoles."

[lib]
path = "src/pom_db.rs"

[dependencies]
pom_config = { path = "../pom_config" }
pom_env = { path = "../pom_env" }
pom_paths = { path = "../pom_paths" }
pom_services = { path = "../pom_services" }
postgres = "0.19"
redis = { version = "0.27", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
pom_ptyhost = { path = "../pom_ptyhost" }
tempfile = "3"
