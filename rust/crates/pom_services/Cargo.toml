[package]
name = "pom_services"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Running a workspace's services: env files, shared-service slots, tool PATH, and start/stop through PTY holders."

[lib]
path = "src/pom_services.rs"

[dependencies]
pom_config = { path = "../pom_config" }
pom_env = { path = "../pom_env" }
pom_layout = { path = "../pom_layout" }
pom_paths = { path = "../pom_paths" }
pom_ports = { path = "../pom_ports" }
pom_ptyhost = { path = "../pom_ptyhost" }
pom_secrets = { path = "../pom_secrets" }
indexmap = "2"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
