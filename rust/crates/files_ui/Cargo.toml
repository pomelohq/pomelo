[package]
name = "files_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Files feature view: renders the file tree + selected file (syntax-highlighted) as a workspace FunctionView. Depends on the workspace toolkit + files logic + editor."

[lib]
path = "src/files_ui.rs"

[dependencies]
ui = { path = "../ui" }
workspace = { path = "../workspace" }
terminal = { path = "../terminal" }
files = { path = "../files" }
git = { path = "../git" }
lsp = { path = "../lsp" }
editor = { package = "pomelo-editor", path = "../editor" }
nucleo-matcher = "0.3.1"
pulldown-cmark = { version = "0.13", default-features = false }
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
