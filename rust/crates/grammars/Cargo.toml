[package]
name = "grammars"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Grammar packages the app can download: the index, verified downloads, installs, and what to suggest."

[lib]
path = "src/grammars.rs"

[dependencies]
editor = { package = "pomelo-editor", path = "../editor" }
pom_paths = { path = "../pom_paths" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
