[package]
name = "pomelo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pomelo — a cross-platform dev-environment app, rewritten in Rust."

[[bin]]
name = "pomelo"
path = "src/main.rs"

[dependencies]
pomelo-editor = { path = "../editor" }
winit.workspace = true
anyhow.workspace = true
wgpu.workspace = true
glyphon.workspace = true
pollster.workspace = true
bytemuck.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSView", "NSButton", "NSResponder", "NSControl"] }
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }
