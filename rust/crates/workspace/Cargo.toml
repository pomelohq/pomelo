[package]
name = "workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Workspace layout: top bar, docks (workspace-list panel), pane/tab groups. Computes rects + hit regions."

[lib]
path = "src/workspace.rs"

[dependencies]
desktop = { path = "../desktop" }
pom_paths = { path = "../pom_paths" }
ui = { path = "../ui" }
terminal = { path = "../terminal" }
editor = { package = "pomelo-editor", path = "../editor" }
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde.workspace = true
serde_json.workspace = true
workspace_hack = { version = "0.1", path = "../workspace_hack" }
