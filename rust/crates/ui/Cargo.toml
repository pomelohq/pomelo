[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal GPU UI primitives (colored rects + text) on a wgpu surface. The reactive framework layer."

[lib]
path = "src/ui.rs"

[dependencies]
reactor = { path = "../reactor" }
winit.workspace = true
anyhow.workspace = true
wgpu.workspace = true
glyphon.workspace = true
resvg.workspace = true
pollster.workspace = true
bytemuck.workspace = true
serde_json.workspace = true
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal", "CALayer", "CAMetalLayer"] }
