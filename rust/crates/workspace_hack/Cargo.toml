[package]
name = "workspace_hack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pins one feature set for third-party dependencies across the workspace; generated by cargo hakari."
publish = false

[lib]
path = "src/workspace_hack.rs"

### BEGIN HAKARI SECTION
[dependencies]
aho-corasick = { version = "1" }
anyhow = { version = "1" }
bitflags = { version = "2", default-features = false, features = ["serde"] }
bytemuck = { version = "1", default-features = false, features = ["aarch64_simd", "derive", "extern_crate_alloc", "min_const_generics"] }
cranelift-bitset = { version = "0.135", default-features = false, features = ["enable-serde"] }
crc32fast = { version = "1" }
crypto-common = { version = "0.1", default-features = false, features = ["getrandom", "std"] }
cursor-icon = { version = "1" }
digest = { version = "0.10", features = ["mac", "std"] }
futures-channel = { version = "0.3", features = ["sink"] }
futures-core = { version = "0.3" }
futures-sink = { version = "0.3" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more", "serde"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
indexmap = { version = "2", features = ["serde"] }
log = { version = "0.4", default-features = false, features = ["std"] }
memchr = { version = "2" }
num-traits = { version = "0.2", features = ["i128"] }
once_cell = { version = "1" }
percent-encoding = { version = "2" }
pulley-interpreter = { version = "48", default-features = false, features = ["disas", "interp", "std"] }
regex = { version = "1" }
regex-automata = { version = "0.4" }
regex-syntax = { version = "0.8" }
rustc-hash = { version = "2" }
semver = { version = "1", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "rc", "result", "std"] }
serde_json = { version = "1" }
sha2 = { version = "0.10" }
smallvec = { version = "1", default-features = false, features = ["const_new", "serde", "union"] }
thiserror = { version = "2" }
time = { version = "0.3", features = ["local-offset", "macros"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-core = { version = "0.1", default-features = false, features = ["std"] }
typenum = { version = "1", default-features = false, features = ["const-generics"] }
unicode-bidi = { version = "0.3" }
unicode-properties = { version = "0.1" }
url = { version = "2", features = ["serde"] }
wasmtime-internal-core = { version = "48", default-features = false, features = ["serde", "std"] }

[build-dependencies]
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
indexmap = { version = "2" }
memchr = { version = "2", default-features = false, features = ["std"] }
proc-macro2 = { version = "1" }
quote = { version = "1" }
semver = { version = "1" }
serde_core = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", features = ["preserve_order"] }
syn = { version = "3", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }

[target.aarch64-apple-darwin.dependencies]
bitflags = { version = "2", default-features = false, features = ["std"] }
block2 = { version = "0.5" }
core-foundation-sys = { version = "0.8" }
errno = { version = "0.3" }
getrandom = { version = "0.4", default-features = false, features = ["std", "sys_rng"] }
half = { version = "2", features = ["num-traits"] }
image = { version = "0.25", default-features = false, features = ["tiff"] }
libc = { version = "0.2" }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
objc2-3b31131e45eafb45 = { package = "objc2", version = "0.6" }
objc2-app-kit = { version = "0.2", features = ["NSAlert", "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSButton", "NSColor", "NSControl", "NSCursor", "NSDragging", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSOpenGLView", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScreen", "NSSound", "NSTextInputClient", "NSTextInputContext", "NSView", "NSWindow", "NSWindowScripting", "NSWindowTabGroup", "block2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFArray", "CFAttributedString", "CFBase", "CFCGTypes", "CFCalendar", "CFCharacterSet", "CFData", "CFDate", "CFDictionary", "CFError", "CFFileSecurity", "CFLocale", "CFMachPort", "CFMessagePort", "CFPlugInCOM", "CFRunLoop", "CFSet", "CFStream", "CFString", "CFURL", "CFUUID", "objc2", "std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGColor", "CGColorSpace", "CGContext", "CGDataProvider", "CGDirectDisplay", "CGEventTypes", "CGFont", "CGImage", "CGPath", "objc2", "std"] }
objc2-d8f496e17d97b5cb = { package = "objc2", version = "0.5", features = ["relax-sign-encoding"] }
objc2-foundation-468e82937335b1c9 = { package = "objc2-foundation", version = "0.3", default-features = false, features = ["NSArray", "NSBundle", "NSCoder", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSFileManager", "NSFileWrapper", "NSGeometry", "NSItemProvider", "NSKeyValueObserving", "NSLocale", "NSNull", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSSet", "NSString", "NSThread", "NSURL", "NSValue", "objc2-core-foundation", "std"] }
objc2-foundation-6f8ce4dd05d13bba = { package = "objc2-foundation", version = "0.2", features = ["NSArray", "NSAttributedString", "NSBundle", "NSCalendar", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSDistributedNotificationCenter", "NSEnumerator", "NSError", "NSException", "NSFileWrapper", "NSFormatter", "NSGeometry", "NSItemProvider", "NSKeyValueObserving", "NSLocale", "NSNotification", "NSObjCRuntime", "NSObject", "NSPathUtilities", "NSProcessInfo", "NSRange", "NSRunLoop", "NSScriptCommand", "NSScriptStandardSuiteCommands", "NSSet", "NSString", "NSThread", "NSURL", "NSUndoManager", "NSUserActivity", "NSValue", "NSZone", "block2", "dispatch"] }
rustix = { version = "1", features = ["event", "fs", "mm", "param", "pipe", "process", "termios", "time"] }

### END HAKARI SECTION
