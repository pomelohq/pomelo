[package]
name = "pom_remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remote machines over SSH: the host list (hosts.json) and the ssh command that runs pom there."

[lib]
path = "src/pom_remote.rs"

[dependencies]
pom_paths = { path = "../pom_paths" }
pom_agent = { path = "../pom_agent" }
pom_config = { path = "../pom_config" }
pom_core = { path = "../pom_core" }
pom_layout = { path = "../pom_layout" }
pom_ptyhost = { path = "../pom_ptyhost" }
pom_push = { path = "../pom_push" }
pom_services = { path = "../pom_services" }
pom_workspace = { path = "../pom_workspace" }
serde.workspace = true
serde_json.workspace = true
workspace_hack = { version = "0.1", path = "../workspace_hack" }

[dev-dependencies]
tempfile = "3"
