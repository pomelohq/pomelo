[package]
name = "module_store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A shared store of node_modules keyed by lockfile, imported into new workspaces by copy-on-write clone, hard link or copy."

[lib]
path = "src/module_store.rs"

[dependencies]
libc = "0.2"
pom_paths = { path = "../pom_paths" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
settings = { path = "../settings" }
tempfile = "3"
