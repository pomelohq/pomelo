[package]
name = "pom_push"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sync on push: the relay's signed GitHub hook, the per-workspace fast-forward worker and its journal."

[lib]
path = "src/pom_push.rs"

[dependencies]
pom_config = { path = "../pom_config" }
pom_env = { path = "../pom_env" }
pom_layout = { path = "../pom_layout" }
pom_lock = { path = "../pom_lock" }
pom_paths = { path = "../pom_paths" }
pom_proxy = { path = "../pom_proxy" }
pom_ptyhost = { path = "../pom_ptyhost" }
pom_secrets = { path = "../pom_secrets" }
pom_services = { path = "../pom_services" }
pom_sync = { path = "../pom_sync" }
pom_workspace = { path = "../pom_workspace" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
workspace_hack = { version = "0.1", path = "../workspace_hack" }

[dev-dependencies]
tempfile = "3"
