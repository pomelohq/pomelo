[package]
name = "onboarding"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Onboarding a new project: what its config sets up, and checking it installs and boots."

[lib]
path = "src/onboarding.rs"

[dependencies]
pom_config = { path = "../pom_config" }
pom_doctor = { path = "../pom_doctor" }
