[package]
name = "pull_request_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pull requests in the app: each workspace's PR status refreshed in the background, and the PR tab (overview and checks)."

[lib]
path = "src/pull_request_ui.rs"

[dependencies]
git = { path = "../git" }
pom_forge = { path = "../pom_forge" }
pom_paths = { path = "../pom_paths" }
terminal = { path = "../terminal" }
ui = { path = "../ui" }
workspace = { path = "../workspace" }

[dev-dependencies]
tempfile = "3"
