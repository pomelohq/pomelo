name: CI

# Path-gated so a docs-only change runs nothing heavy; the build is cached so repeat runs only rebuild what changed.
# Releases live in release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  # The same `make check` run locally: fmt, clippy -D warnings, tests.
  rust:
    name: Rust fmt + clippy + test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      # Only main uses it: to drop older build caches after saving the new one.
      actions: write
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
      # Keeps the cached target/ small enough to restore quickly; make check's trim drops it past this.
      POM_TARGET_LIMIT_GB: 8
    steps:
      # Full history, to tell which files changed since the commit the cached build came from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      # Our own crates are cached too, not only dependencies. Only main saves (a new entry per commit), so a PR
      # starts from the latest main build and the cache stays within the repository's limit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml') }}-
      # Cargo rebuilds a crate when a source is newer than its last build, and a checkout makes every file new.
      # Unchanged files get an old time, files changed since the cached build's commit the current one.
      - name: Date sources by what changed since the cached build
        run: |
          git ls-files -z | xargs -0 touch -t 200001010000
          built="$(cat target/.built-from 2>/dev/null || true)"
          if [ -n "$built" ] && git cat-file -e "$built^{commit}" 2>/dev/null; then
            echo "cached build is from $built"
            git diff --name-only --relative "$built" HEAD | while IFS= read -r file; do
              if [ -e "$file" ]; then touch "$file"; fi
            done
          else
            echo "no usable cached build: everything is new"
            git ls-files -z | xargs -0 touch
          fi
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hakari
      - run: make check
      # Releases run under the hardened runtime, where a wasm grammar only runs with the app's entitlements:
      # sign the editor tests the same way and parse with a package grammar.
      - name: Load a wasm grammar under the hardened runtime
        run: |
          tests="$(cargo test -p pomelo-editor --lib --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null and .profile.test) | .executable' | head -1)"
          codesign --force --options runtime --entitlements scripts/Pomelo.entitlements --sign - "$tests"
          cd crates/editor && "$tests" a_package_grammar_compiles_off_thread_then_highlights
      - name: Size of the build cache
        run: du -sh target ~/.cargo/registry 2>/dev/null || true
      - if: github.ref == 'refs/heads/main'
        run: git rev-parse HEAD > target/.built-from
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Each main build saves a new entry of a gigabyte or more; past the repository's limit GitHub evicts the
      # least recently used, which can be the release or wasi-sdk caches. Only the newest two are ever restored.
      - name: Drop older build caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: cargo-${{ runner.os }}-${{ runner.arch }}-
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --sort created_at --order desc --limit 100 \
            --json id --jq '.[2:][].id' | while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # The same `make check` on Linux, which ships its own build: platform code there compiles and is tested only here.
  rust-linux:
    name: Rust fmt + clippy + test (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
      POM_TARGET_LIMIT_GB: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the libraries the window and fonts build against
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      # Dependencies only, saved from main so a PR starts warm without a second copy of every crate's build.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: linux-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hakari
      - run: make check

  # pom alone on a server: it must link no display libraries and work headless in a clean Ubuntu container
  # (workspace create with a Postgres database, start --wait, the dev proxy, an agent session).
  cli-smoke:
    name: pom CLI headless smoke (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: linux-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p pom_cli --bin pom
      # Workspace caps need a systemd user manager, which the container below lacks: run them on the runner.
      - name: Workspace limits in a real systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/systemd/private" ]; then break; fi
            sleep 1
          done
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers" || true
          POM_REAL_CGROUP=1 cargo test -p pom_ptyhost --test limits_real -- --nocapture
      - name: pom links no display libraries
        run: |
          ldd target/debug/pom
          if ldd target/debug/pom | grep -Ei 'libx11|libxcb|libxkb|wayland|libgl|libegl|vulkan|fontconfig|freetype'; then
            echo "::error::pom links a display library"; exit 1
          fi
      - name: Headless in a clean Ubuntu 24.04 container
        run: |
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            ubuntu:24.04 bash -c '
              set -e
              apt-get update -q >/dev/null
              apt-get install -yq --no-install-recommends git curl ca-certificates python3 procps \
                docker.io docker-compose-v2 >/dev/null
              install -m755 target/debug/pom /usr/local/bin/pom
              pom --version
              scripts/linux-cli-smoke.sh
            '

  # The macOS runners have no Docker; these tests need a real Postgres, so they run here.
  postgres:
    name: Real Postgres tests (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
      POM_DOCKER_TEST: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: cargo test -p pom_services --test snapshots --test queues -- --test-threads 1

  # Workflow mistakes otherwise show only when the workflow runs, which for releases is at tag time.
  actionlint:
    name: Lint workflows
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --max-time 60 --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The one required check: path-gated jobs may be skipped, and a skipped job never satisfies a branch rule.
  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, rust, rust-linux, cli-smoke, postgres, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} rust=${{ needs.rust.result }} rust-linux=${{ needs.rust-linux.result }} cli-smoke=${{ needs.cli-smoke.result }} postgres=${{ needs.postgres.result }} actionlint=${{ needs.actionlint.result }}"
          test "${{ needs.changes.result }}" = "success" || exit 1
          case "${{ needs.rust.result }}" in success|skipped) ;; *) echo "rust failed"; exit 1 ;; esac
          case "${{ needs.rust-linux.result }}" in success|skipped) ;; *) echo "rust on Linux failed"; exit 1 ;; esac
          case "${{ needs.cli-smoke.result }}" in success|skipped) ;; *) echo "pom CLI smoke failed"; exit 1 ;; esac
          case "${{ needs.postgres.result }}" in success|skipped) ;; *) echo "postgres tests failed"; exit 1 ;; esac
          case "${{ needs.actionlint.result }}" in success|skipped) ;; *) echo "workflow lint failed"; exit 1 ;; esac
          echo "CI gate passed"
