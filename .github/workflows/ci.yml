name: CI

# Path-gated so a docs-only change runs nothing heavy; dependencies are cached so repeat runs stay fast.
# Releases live in release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'docs/config-*.md'
              - '.github/workflows/ci.yml'

  # The same `make check` run locally: fmt, clippy -D warnings, tests.
  rust:
    name: Rust fmt + clippy + test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: make check

  # The one required check: path-gated jobs may be skipped, and a skipped job never satisfies a branch rule.
  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, rust]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} rust=${{ needs.rust.result }}"
          test "${{ needs.changes.result }}" = "success" || exit 1
          case "${{ needs.rust.result }}" in success|skipped) ;; *) echo "rust failed"; exit 1 ;; esac
          echo "CI gate passed"
