name: CI

# Path-gated so a docs-only change runs nothing heavy; the build is cached so repeat runs only rebuild what changed.
# Releases live in release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      workflows: ${{ steps.f.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'docs/config-*.md'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  # The same `make check` run locally: fmt, clippy -D warnings, tests.
  rust:
    name: Rust fmt + clippy + test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      # Only main uses it: to drop older build caches after saving the new one.
      actions: write
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
      # Keeps the cached target/ small enough to restore quickly; make check's trim drops it past this.
      POM_TARGET_LIMIT_GB: 8
    steps:
      # Full history, to tell which files changed since the commit the cached build came from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      # Our own crates are cached too, not only dependencies. Only main saves (a new entry per commit), so a PR
      # starts from the latest main build and the cache stays within the repository's limit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml') }}-
      # Cargo rebuilds a crate when a source is newer than its last build, and a checkout makes every file new.
      # Unchanged files get an old time, files changed since the cached build's commit the current one.
      - name: Date sources by what changed since the cached build
        run: |
          git ls-files -z | xargs -0 touch -t 200001010000
          built="$(cat target/.built-from 2>/dev/null || true)"
          if [ -n "$built" ] && git cat-file -e "$built^{commit}" 2>/dev/null; then
            echo "cached build is from $built"
            git diff --name-only --relative "$built" HEAD | while IFS= read -r file; do
              if [ -e "$file" ]; then touch "$file"; fi
            done
          else
            echo "no usable cached build: everything is new"
            git ls-files -z | xargs -0 touch
          fi
      - run: make check
      # Releases run under the hardened runtime, where a wasm grammar only runs with the app's entitlements:
      # sign the editor tests the same way and parse with a package grammar.
      - name: Load a wasm grammar under the hardened runtime
        run: |
          tests="$(cargo test -p pomelo-editor --lib --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null and .profile.test) | .executable' | head -1)"
          codesign --force --options runtime --entitlements scripts/Pomelo.entitlements --sign - "$tests"
          cd crates/editor && "$tests" a_package_grammar_compiles_off_thread_then_highlights
      - name: Size of the build cache
        run: du -sh target ~/.cargo/registry 2>/dev/null || true
      - if: github.ref == 'refs/heads/main'
        run: git rev-parse HEAD > target/.built-from
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Each main build saves a new entry of a gigabyte or more; past the repository's limit GitHub evicts the
      # least recently used, which can be the release or wasi-sdk caches. Only the newest two are ever restored.
      - name: Drop older build caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: cargo-${{ runner.os }}-${{ runner.arch }}-
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --sort created_at --order desc --limit 100 \
            --json id --jq '.[2:][].id' | while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # Workflow mistakes otherwise show only when the workflow runs, which for releases is at tag time.
  actionlint:
    name: Lint workflows
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --max-time 60 --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The one required check: path-gated jobs may be skipped, and a skipped job never satisfies a branch rule.
  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, rust, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} rust=${{ needs.rust.result }} actionlint=${{ needs.actionlint.result }}"
          test "${{ needs.changes.result }}" = "success" || exit 1
          case "${{ needs.rust.result }}" in success|skipped) ;; *) echo "rust failed"; exit 1 ;; esac
          case "${{ needs.actionlint.result }}" in success|skipped) ;; *) echo "workflow lint failed"; exit 1 ;; esac
          echo "CI gate passed"
