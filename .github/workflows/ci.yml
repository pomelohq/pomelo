name: CI

# Path-gated so work is only spent on what changed: a docs-only PR runs neither
# the Go tests nor the app build; a Go change runs the Go gate and relinks/tests
# the app; an app-only change runs just the app. Dependencies are cached so repeat
# runs stay fast. Release signing/publishing lives in release.yml (app-build.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.f.outputs.go }}
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/detect/stacks/**'
              - 'internal/detect/catalog.yaml'
            app:
              - 'desktop/PomeloApp/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
              - '.github/workflows/app-build.yml'
              - '.github/actions/setup-xcode/**'

  go:
    name: Go build + vet + test
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Test (-short skips subprocess integration tests, headless CI can't PTY)
        run: go test -short ./...

  app:
    name: App build + Swift tests
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Select Xcode
        uses: ./.github/actions/setup-xcode
      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: desktop/PomeloApp/.ddata/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('desktop/PomeloApp/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build libpom (Go c-archive)
        run: |
          GOTOOLCHAIN=local CGO_ENABLED=1 go build \
            -tags nostatic -trimpath -ldflags="-s -w" \
            -buildmode=c-archive -o desktop/PomeloApp/Vendor/libpom.a ./cmd/libpom/
          cp desktop/PomeloApp/Vendor/libpom.h desktop/PomeloApp/Sources/CPom/include/libpom.h
      - name: Build app + run Swift tests
        working-directory: desktop/PomeloApp
        run: |
          xcodebuild test -scheme PomeloApp -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .ddata -skipPackagePluginValidation \
            CLANG_ENABLE_CODE_COVERAGE=NO

  lint:
    name: Lint (ADR conventions)
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: View-layer FFI boundary (ADR 0001)
        run: ./scripts/lint-view-ffi.sh

  # Single stable required check. Path-gated jobs may be skipped (docs-only PR),
  # and a skipped job never satisfies a branch rule — so gate on this always-run
  # job that passes when the needed jobs each succeeded or were skipped.
  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [changes, go, app, lint]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} go=${{ needs.go.result }} app=${{ needs.app.result }} lint=${{ needs.lint.result }}"
          test "${{ needs.changes.result }}" = "success" || exit 1
          for r in "${{ needs.go.result }}" "${{ needs.app.result }}" "${{ needs.lint.result }}"; do
            case "$r" in success|skipped) ;; *) echo "dependency failed: $r"; exit 1 ;; esac
          done
          echo "CI gate passed"
