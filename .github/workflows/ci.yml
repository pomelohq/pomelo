name: CI

# A docs-only change runs nothing heavy and a pull request tests only what it touches; the build is cached so repeat
# runs only rebuild what changed.
# Releases live in release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the change needs: a docs-only change runs nothing heavy, and a pull request tests only the crates it
  # changed and every crate depending on them. Main runs everything (and saves the caches).
  orchestrate:
    name: Plan the checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_tests: ${{ steps.plan.outputs.run_tests }}
      run_action_checks: ${{ steps.plan.outputs.run_action_checks }}
      filterset: ${{ steps.plan.outputs.filterset }}
      run_pom_server: ${{ steps.plan.outputs.run_pom_server }}
      run_cli_smoke: ${{ steps.plan.outputs.run_cli_smoke }}
      run_postgres: ${{ steps.plan.outputs.run_postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        working-directory: rust
        run: |
          if [ -z "$GITHUB_BASE_REF" ]; then
            plan="$(printf 'run_tests=true\nrun_action_checks=true\nfilterset=\naffected=\n')"
          else
            plan="$(scripts/changed-crates.sh "$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)")"
          fi
          echo "$plan" | tee -a "$GITHUB_OUTPUT"
          run_tests="$(sed -n 's/^run_tests=//p' <<<"$plan")"
          affected="$(sed -n 's/^affected=//p' <<<"$plan")"
          # The real-host jobs run only when a crate they test is affected (an empty set means every crate is).
          touches() {
            local crate
            if [ "$run_tests" != true ]; then echo false; return; fi
            if [ -z "${affected// /}" ]; then echo true; return; fi
            for crate in "$@"; do
              if [[ "$affected" == *" $crate "* ]]; then echo true; return; fi
            done
            echo false
          }
          {
            echo "run_pom_server=$(touches pom_server pom_rpc pom_ptyhost pom_remote pom_cli)"
            echo "run_cli_smoke=$(touches pom_cli pom_ptyhost)"
            echo "run_postgres=$(touches pom_services pom_cli)"
          } | tee -a "$GITHUB_OUTPUT"

  check_style:
    name: Style
    needs: orchestrate
    if: ${{ needs.orchestrate.outputs.run_tests == 'true' || needs.orchestrate.outputs.run_action_checks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo fmt --check
        if: ${{ needs.orchestrate.outputs.run_tests == 'true' }}
        working-directory: rust
        run: |
          rustup show >/dev/null
          cargo fmt --check
      # Workflow mistakes otherwise show only when the workflow runs, which for releases is at tag time.
      - name: actionlint
        if: ${{ needs.orchestrate.outputs.run_action_checks == 'true' }}
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --max-time 60 --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Clippy builds cold: it still finishes before the tests, and one cache restore per OS keeps the cache download
  # (throttled per account) small.
  clippy_mac:
    name: Clippy (macOS)
    needs: orchestrate
    if: ${{ needs.orchestrate.outputs.run_tests == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hakari
      - run: make hakari-check lint

  run_tests_mac:
    name: Tests (macOS)
    needs: orchestrate
    if: ${{ needs.orchestrate.outputs.run_tests == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      # Only main uses it: to drop older build caches after saving the new one.
      actions: write
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
      POM_TARGET_LIMIT_GB: 8
      NEXTEST_PROFILE: ci
      TEST_FILTER: ${{ needs.orchestrate.outputs.filterset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      # Our own crates are cached too, not only dependencies. Only main saves (a new entry per commit), so a PR
      # starts from the latest main build and the cache stays within the repository's limit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml') }}-
      - name: Date sources by what changed since the cached build
        run: scripts/date-sources.sh
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Tests (a test that passes only on its retry is listed as flaky)
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Flag flaky tests
        if: ${{ always() }}
        run: |
          grep -E '^\s+FLAKY' "$RUNNER_TEMP/test.log" | sort -u | while IFS= read -r line; do
            echo "::warning title=Flaky test::$(echo "$line" | sed -E 's/^ +//')"
          done || true
      # Releases run under the hardened runtime, where a wasm grammar only runs with the app's entitlements:
      # sign the editor tests the same way and parse with a package grammar.
      - name: Load a wasm grammar under the hardened runtime
        run: |
          tests="$(cargo test -p pomelo-editor --lib --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null and .profile.test) | .executable' | head -1)"
          codesign --force --options runtime --entitlements scripts/Pomelo.entitlements --sign - "$tests"
          cd crates/editor && "$tests" a_package_grammar_compiles_off_thread_then_highlights
      - name: Size of the build cache
        run: du -sh target ~/.cargo/registry 2>/dev/null || true
      - if: github.ref == 'refs/heads/main'
        run: git rev-parse HEAD > target/.built-from
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Each main build saves a new entry of a gigabyte or more; past the repository's limit GitHub evicts the
      # least recently used, which can be the release or wasi-sdk caches. Only the newest two are ever restored.
      - name: Drop older build caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: cargo-${{ runner.os }}-${{ runner.arch }}-
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --sort created_at --order desc --limit 100 \
            --json id --jq '.[2:][].id' | while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # Linux ships its own build: platform code there compiles and is tested only here.
  clippy_linux:
    name: Clippy (Linux)
    needs: orchestrate
    if: ${{ needs.orchestrate.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the libraries the window and fonts build against
        run: scripts/install-linux-build-deps.sh
      - run: rustup show
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-hakari
      - run: make hakari-check lint

  run_tests_linux:
    name: Tests (Linux)
    needs: orchestrate
    if: ${{ needs.orchestrate.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Only main uses it: to drop older dependency caches.
      actions: write
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
      POM_TARGET_LIMIT_GB: 8
      NEXTEST_PROFILE: ci
      TEST_FILTER: ${{ needs.orchestrate.outputs.filterset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the libraries the window and fonts build against
        run: scripts/install-linux-build-deps.sh
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      # Dependencies only, saved from main so a PR starts warm without a second copy of every crate's build.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: linux-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Tests (a test that passes only on its retry is listed as flaky)
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Flag flaky tests
        if: ${{ always() }}
        run: |
          grep -E '^\s+FLAKY' "$RUNNER_TEMP/test.log" | sort -u | while IFS= read -r line; do
            echo "::warning title=Flaky test::$(echo "$line" | sed -E 's/^ +//')"
          done || true
      # A changed Cargo.lock starts a new entry while the old ones stay; only the newest is restored. This job's
      # own entry is saved after it ends, so the one kept here is the previous build.
      - name: Drop older dependency caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "v0-rust-linux-ci-" --sort created_at --order desc \
            --limit 100 --json id --jq '.[1:][].id' | while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # pom alone on a server: it must link no display libraries and work headless in a clean Ubuntu container
  # (workspace create with a Postgres database, start --wait, the dev proxy, an agent session).
  cli-smoke:
    name: pom CLI headless smoke (Linux)
    needs: orchestrate
    if: ${{ needs.orchestrate.outputs.run_cli_smoke == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      # Only main uses it: to drop older dependency caches.
      actions: write
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: linux-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p pom_cli --bin pom
      # Workspace caps need a systemd user manager, which the container below lacks: run them on the runner.
      - name: Workspace limits in a real systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/systemd/private" ]; then break; fi
            sleep 1
          done
          cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers" || true
          POM_REAL_CGROUP=1 cargo test -p pom_ptyhost --test limits_real -- --nocapture
      - name: pom links no display libraries
        run: |
          ldd target/debug/pom
          if ldd target/debug/pom | grep -Ei 'libx11|libxcb|libxkb|wayland|libgl|libegl|vulkan|fontconfig|freetype'; then
            echo "::error::pom links a display library"; exit 1
          fi
      - name: Headless in a clean Ubuntu 24.04 container
        run: |
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            ubuntu:24.04 bash -c '
              set -e
              apt-get update -q >/dev/null
              apt-get install -yq --no-install-recommends git curl ca-certificates python3 procps \
                docker.io docker-compose-v2 >/dev/null
              install -m755 target/debug/pom /usr/local/bin/pom
              pom --version
              scripts/linux-cli-smoke.sh
            '
      - name: Drop older dependency caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "v0-rust-linux-cli-" --sort created_at --order desc \
            --limit 100 --json id --jq '.[1:][].id' | while read -r id; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # pom server on the platform it mostly runs on: socket permissions, the peer uid check (SO_PEERCRED), the
  # lock, idle and socket-removed exits, terminals over real holders (latency and a 200 MiB flood), pushes and
  # agent leases, followed service output and workspace jobs, and the app's reads, shells, agents, output and
  # jobs through `pom server proxy` behind a fake ssh.
  pom-server:
    name: pom server (Linux)
    needs: orchestrate
    if: ${{ needs.orchestrate.outputs.run_pom_server == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: linux-cli
          save-if: false
      # pom_ptyhost builds the holder binary the terminal tests run.
      - run: cargo test -p pom_server -p pom_rpc -p pom_ptyhost
      - run: cargo test -p pom_remote server
      - run: cargo test -p pom_remote watch
      - run: cargo test -p pom_cli --test remote server
      # Proxies SIGKILLed mid-stream, a killed server and holder, a job followed again, pom updated from a release.
      - run: cargo test -p pom_cli --test remote -- chaos session_dies reconnected updating_pom --nocapture
      # sshd and its throwaway key live only on this runner.
      - name: Start a real sshd on this runner
        run: |
          sudo apt-get install -yq --no-install-recommends openssh-server >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -q -f ~/.ssh/pom_ci_key
          cat ~/.ssh/pom_ci_key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          printf 'Host localhost\n  IdentityFile ~/.ssh/pom_ci_key\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          sudo systemctl start ssh || sudo service ssh start
          ssh -o BatchMode=yes localhost true
      - name: Reconnect through the real sshd after its session is killed
        run: POM_REAL_SSH=1 cargo test -p pom_cli --test remote real_sshd_session -- --nocapture
      - name: Forward a port through the real sshd, alone and on a shared connection
        run: POM_REAL_SSH=1 cargo test -p pom_remote real_sshd_forward -- --nocapture
      # Measures keystrokes through a real ssh session without a tty.
      - name: Keystrokes through the real sshd
        continue-on-error: true
        run: POM_REAL_SSH=1 cargo test -p pom_cli --test remote real_sshd_keystroke -- --nocapture

  # The macOS runners have no Docker; these tests need a real Postgres (and Redis), so they run here.
  postgres:
    name: Real Postgres tests (Linux)
    needs: orchestrate
    if: ${{ needs.orchestrate.outputs.run_postgres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_INCREMENTAL: 0
      POM_DOCKER_TEST: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - run: sudo apt-get update -q >/dev/null && sudo apt-get install -yq --no-install-recommends redis-server >/dev/null
      - run: cargo test -p pom_services --test queue_counts
        env:
          POM_REDIS_TEST: 1
      - run: cargo test -p pom_services --test snapshots --test queues -- --test-threads 1
      - run: cargo test -p pom_cli --test transfer -- --test-threads 1

  # The one required check: gated jobs may be skipped, and a skipped job never satisfies a branch rule.
  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [orchestrate, check_style, clippy_mac, run_tests_mac, clippy_linux, run_tests_linux, cli-smoke, pom-server, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          test "$(echo "$RESULTS" | jq -r '.orchestrate.result')" = "success" || exit 1
          failed="$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')"
          if [ -n "$failed" ]; then
            echo "failed: $failed"
            exit 1
          fi
          echo "CI gate passed"
