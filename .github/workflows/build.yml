name: Build

# The build every published download comes from, shared by release.yml (a stable tag) and nightly.yml (main each
# night): Pomelo.app signed with the Developer ID and the DMG notarized, the update tarball signed with the Sparkle
# EdDSA key, and the Linux tarballs. It publishes nothing; the caller uploads the artifacts it leaves:
#   macos         Pomelo-<v>.dmg, Pomelo-<v>.app.tar.gz (+ .sig), latest.json, appcast.xml, notes.md
#   linux-<arch>  Pomelo-<v>-linux-<arch>.tar.gz, pom-<v>-linux-<arch>.tar.gz
#   linux-signatures  a .sig for each Linux tarball, which pom self-update, the Linux app and the host update check
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        type: string
        required: true
      version:
        description: The version the build carries; rust/Cargo.toml is stamped with it when it differs.
        type: string
        required: true
      stable:
        description: A stable release, whose notes and update feed come from its CHANGELOG block.
        type: boolean
        required: true

permissions:
  contents: read

env:
  SPARKLE_VERSION: 2.6.4

jobs:
  macos:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 90
    env:
      # pom reports this version, which the app compares with its own to offer updating pom on a host.
      POM_BUILD_VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Stamp the version
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/set-version.sh "$VERSION"
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      # A tag's own cache is never seen by the next tag; this reads the one release-cache.yml keeps on main.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: release
          save-if: false

      # The app carries the grammars index so it knows the packages offline: a build carries the one published
      # now, refused unless every package is signed by the app's key. Without network, the repository's copy.
      - name: Embed the published grammars index
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/grammars/index.json"
          if curl -fsSL --max-time 60 --retry 3 -o "$RUNNER_TEMP/grammars-index.json" "$url"; then
            cargo run --release -q -p grammar_packager -- check-index --index "$RUNNER_TEMP/grammars-index.json"
            cp "$RUNNER_TEMP/grammars-index.json" grammars/index.json
          else
            echo "::warning::could not download the published grammars index; the build carries the repository's copy"
          fi
          cargo run --release -q -p grammar_packager -- check-index --index grammars/index.json

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          read -ra KEYCHAINS <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KC" "${KEYCHAINS[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials pomelo-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID"

      - name: Sparkle signing tool and key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          echo "SIGN_UPDATE=$RUNNER_TEMP/sparkle/bin/sign_update" >> "$GITHUB_ENV"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle_ed_key" >> "$GITHUB_ENV"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          STABLE: ${{ inputs.stable }}
        run: |
          mkdir -p target
          SECTION=""
          AUTO=""
          if [ "$STABLE" = true ]; then
            SECTION=$(awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {g=1; next}
              g && /^## \[/ {exit}
              g {print}' ../CHANGELOG.md)
            AUTO=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$VERSION" --jq .body 2>/dev/null || true)
          fi
          # The curated CHANGELOG section leads; the generated PR list follows. Generated notes alone otherwise.
          if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            { printf '%s\n' "$SECTION"; [ -n "$AUTO" ] && printf '\n---\n\n%s\n' "$AUTO"; } > target/notes.md
            FEED="$SECTION"
          else
            printf '%s\n' "${AUTO:-Pomelo v$VERSION}" > target/notes.md
            FEED="$AUTO"
          fi
          {
            echo "RELEASE_NOTES<<__POMEOF__"
            printf '%s\n' "$FEED"
            echo "__POMEOF__"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize the DMG
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: pomelo-notary
        run: scripts/make-dmg.sh

      - name: Check the bundle keeps the update key
        run: |
          KEY=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" target/Pomelo.app/Contents/Info.plist)
          grep -q "UPDATE_PUBLIC_KEY: &str = \"$KEY\"" crates/auto_update/src/*.rs

      - name: Update tarball, signatures and feed
        run: |
          scripts/make-appcast.sh
          scripts/sign-release.sh

      - name: Clean up keychain and key
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sparkle_ed_key"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            rust/target/Pomelo-${{ inputs.version }}.dmg
            rust/target/Pomelo-${{ inputs.version }}.app.tar.gz
            rust/target/Pomelo-${{ inputs.version }}.app.tar.gz.sig
            rust/target/latest.json
            rust/target/appcast.xml
            rust/target/notes.md
          if-no-files-found: error

  # Each architecture builds the app and CLI tarballs on its own runner.
  linux:
    name: Linux tarball (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # pom reports this version, which the app compares with its own to offer updating pom on a host.
      POM_BUILD_VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Stamp the version
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/set-version.sh "$VERSION"
      - name: Install the libraries the window and fonts build against
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      - name: Embed the published grammars index
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/grammars/index.json"
          if curl -fsSL --max-time 60 --retry 3 -o "$RUNNER_TEMP/grammars-index.json" "$url"; then
            cargo run --release -q -p grammar_packager -- check-index --index "$RUNNER_TEMP/grammars-index.json"
            cp "$RUNNER_TEMP/grammars-index.json" grammars/index.json
          else
            echo "::warning::could not download the published grammars index; the build carries the repository's copy"
          fi
          cargo run --release -q -p grammar_packager -- check-index --index grammars/index.json
      - name: Build the tarballs
        run: |
          scripts/bundle-linux.sh prod
          for TARBALL in target/Pomelo-*-linux-${{ matrix.arch }}.tar.gz target/pom-*-linux-${{ matrix.arch }}.tar.gz; do
            tar -tzf "$TARBALL" | grep -q '/install.sh$'
          done
      # The CLI tarball is for servers without a desktop: pom must not need a display stack to start.
      - name: pom links no display libraries
        run: |
          ldd target/release/pom
          if ldd target/release/pom | grep -Ei 'libx11|libxcb|libxkb|wayland|libgl|libegl|vulkan|fontconfig|freetype'; then
            echo "::error::pom links a display library"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            rust/target/Pomelo-${{ inputs.version }}-linux-${{ matrix.arch }}.tar.gz
            rust/target/pom-${{ inputs.version }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # sign_update runs on macOS only, so the Linux tarballs come here to be signed with the same key.
  linux-sign:
    name: Sign the Linux tarballs
    needs: linux
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: rust/target/linux
      - name: Sparkle signing tool and key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          echo "SIGN_UPDATE=$RUNNER_TEMP/sparkle/bin/sign_update" >> "$GITHUB_ENV"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle_ed_key" >> "$GITHUB_ENV"
      - name: Sign
        env:
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          TARBALLS=(target/linux/Pomelo-"$VERSION"-linux-*.tar.gz target/linux/pom-"$VERSION"-linux-*.tar.gz)
          if [ "${#TARBALLS[@]}" -ne 4 ]; then
            echo "::error::expected 4 Linux tarballs for $VERSION, found ${#TARBALLS[@]}"; exit 1
          fi
          scripts/sign-files.sh "${TARBALLS[@]}"
      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/sparkle_ed_key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-signatures
          path: rust/target/linux/*.sig
          if-no-files-found: error
