name: Release

# Push a version tag (v*) -> build, sign, notarize, and publish the DMG +
# Sparkle appcast to this repo's GitHub Release. All build logic lives in the
# reusable app-build.yml; this just calls it with publish=true. Requires these
# repository secrets:
#   MACOS_CERT_P12          base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD     password for that .p12
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Your Name (TEAMID)"
#   KEYCHAIN_PASSWORD       any string (temp keychain password)
#   NOTARY_APPLE_ID         Apple ID email used for notarization
#   NOTARY_APP_PASSWORD     app-specific password for that Apple ID
#   NOTARY_TEAM_ID          Apple Developer Team ID
#   SPARKLE_ED_PRIVATE_KEY  Sparkle EdDSA private key (the sign_update key)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/app-build.yml
    with:
      publish: true
    secrets: inherit

  # The docs site mirrors this repo's CHANGELOG at build time, but only rebuilds on
  # its own pushes — kick its deploy so the Changelog page reflects this release.
  # Needs a DOCS_DISPATCH_TOKEN secret (fine-grained PAT, Actions: write on
  # pomelohq/pomelo-docs); skips quietly if it isn't set.
  refresh-docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pomelo-docs deploy
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN not set — skipping docs refresh"; exit 0
          fi
          gh workflow run deploy.yml --repo pomelohq/pomelo-docs --ref main
