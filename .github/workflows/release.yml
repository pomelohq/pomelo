name: Release

# Push a version tag (v*, from `make patch|minor|major` on main) -> build Pomelo.app, sign it with the
# Developer ID, notarize the DMG, sign the downloads with the Sparkle EdDSA key, and publish the GitHub Release:
#   Pomelo-<v>.dmg                 install / what older apps' Sparkle feed installs
#   Pomelo-<v>.app.tar.gz (+ .sig) what the in-app updater downloads and verifies
#   appcast.xml                    the Sparkle feed apps from before the rewrite poll
#   Pomelo-<v>-linux-<arch>.tar.gz the Linux app and pom with install.sh (x86_64, aarch64); no in-app updater
#   pom-<v>-linux-<arch>.tar.gz    pom alone with install.sh, for a server without a desktop
# Secrets: MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY, KEYCHAIN_PASSWORD, NOTARY_APPLE_ID,
# NOTARY_APP_PASSWORD, NOTARY_TEAM_ID, SPARKLE_ED_PRIVATE_KEY; DOCS_DISPATCH_TOKEN is optional.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SPARKLE_VERSION: 2.6.4

jobs:
  release:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The notes and the update feed come from CHANGELOG.md's block for this version, and the app reports the
      # version Cargo.toml names: stop before anything is built or signed if either is missing or off.
      - name: Check the tag, the version and the CHANGELOG agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but rust/Cargo.toml says version $CARGO_VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" ../CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' block. Curate it on main, then cut the release again (see the release-audit skill)."
            exit 1
          fi
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      # A tag's own cache is never seen by the next tag; this reads the one release-cache.yml keeps on main.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: release
          save-if: false

      # The app carries the grammars index so it knows the packages offline: a release carries the one published
      # now, refused unless every package is signed by the app's key. Without network, the repository's copy.
      - name: Embed the published grammars index
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/grammars/index.json"
          if curl -fsSL --max-time 60 --retry 3 -o "$RUNNER_TEMP/grammars-index.json" "$url"; then
            cargo run --release -q -p grammar_packager -- check-index --index "$RUNNER_TEMP/grammars-index.json"
            cp "$RUNNER_TEMP/grammars-index.json" grammars/index.json
          else
            echo "::warning::could not download the published grammars index; the release carries the repository's copy"
          fi
          cargo run --release -q -p grammar_packager -- check-index --index grammars/index.json

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          read -ra KEYCHAINS <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KC" "${KEYCHAINS[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials pomelo-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID"

      - name: Sparkle signing tool and key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          echo "SIGN_UPDATE=$RUNNER_TEMP/sparkle/bin/sign_update" >> "$GITHUB_ENV"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle_ed_key" >> "$GITHUB_ENV"

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {g=1; next}
            g && /^## \[/ {exit}
            g {print}' ../CHANGELOG.md)
          AUTO=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body 2>/dev/null || true)
          # The curated CHANGELOG section leads; the generated PR list follows. Generated notes alone otherwise.
          if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            { printf '%s\n' "$SECTION"; [ -n "$AUTO" ] && printf '\n---\n\n%s\n' "$AUTO"; } > "$RUNNER_TEMP/notes.md"
            FEED="$SECTION"
          else
            printf '%s\n' "${AUTO:-Pomelo $GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
            FEED="$AUTO"
          fi
          {
            echo "RELEASE_NOTES<<__POMEOF__"
            printf '%s\n' "$FEED"
            echo "__POMEOF__"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize the DMG
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: pomelo-notary
        run: scripts/make-dmg.sh

      - name: Check the bundle keeps the update key
        run: |
          KEY=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" target/Pomelo.app/Contents/Info.plist)
          grep -q "UPDATE_PUBLIC_KEY: &str = \"$KEY\"" crates/auto_update/src/auto_update.rs

      - name: Update tarball, signatures and feed
        run: |
          scripts/make-appcast.sh
          scripts/sign-release.sh

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd target
          FILES=("Pomelo-$VERSION.dmg" "Pomelo-$VERSION.app.tar.gz" "Pomelo-$VERSION.app.tar.gz.sig" latest.json appcast.xml)
          shasum -a 256 "${FILES[@]}" > checksums.txt
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${FILES[@]}" checksums.txt \
          || gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}" checksums.txt

      - name: Clean up keychain and key
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sparkle_ed_key"

  # Linux has no signing or update feed: each architecture builds the app and CLI tarballs on its own runner,
  # and they join the release once the macOS job has published it.
  linux:
    name: Linux tarball (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the libraries the window and fonts build against
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      # Installs the toolchain rust/rust-toolchain.toml pins.
      - run: rustup show
      - name: Embed the published grammars index
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/grammars/index.json"
          if curl -fsSL --max-time 60 --retry 3 -o "$RUNNER_TEMP/grammars-index.json" "$url"; then
            cargo run --release -q -p grammar_packager -- check-index --index "$RUNNER_TEMP/grammars-index.json"
            cp "$RUNNER_TEMP/grammars-index.json" grammars/index.json
          else
            echo "::warning::could not download the published grammars index; the release carries the repository's copy"
          fi
          cargo run --release -q -p grammar_packager -- check-index --index grammars/index.json
      - name: Build the tarballs
        run: |
          scripts/bundle-linux.sh prod
          for TARBALL in target/Pomelo-*-linux-${{ matrix.arch }}.tar.gz target/pom-*-linux-${{ matrix.arch }}.tar.gz; do
            tar -tzf "$TARBALL" | grep -q '/install.sh$'
          done
      # The CLI tarball is for servers without a desktop: pom must not need a display stack to start.
      - name: pom links no display libraries
        run: |
          ldd target/release/pom
          if ldd target/release/pom | grep -Ei 'libx11|libxcb|libxkb|wayland|libgl|libegl|vulkan|fontconfig|freetype'; then
            echo "::error::pom links a display library"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            rust/target/Pomelo-*-linux-${{ matrix.arch }}.tar.gz
            rust/target/pom-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  linux-publish:
    name: Attach the Linux tarballs
    needs: [release, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          merge-multiple: true
          path: linux
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          FILES=(Pomelo-"$VERSION"-linux-*.tar.gz pom-"$VERSION"-linux-*.tar.gz)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no Linux tarball for $VERSION"; exit 1
          fi
          sha256sum "${FILES[@]}" > checksums-linux.txt
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}" checksums-linux.txt

  # The docs site mirrors this repo's CHANGELOG at build time but only rebuilds on its own pushes: kick its
  # deploy so the Changelog page shows this release. Skips quietly without DOCS_DISPATCH_TOKEN.
  refresh-docs:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger pomelo-docs deploy
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN not set - skipping docs refresh"; exit 0
          fi
          gh workflow run deploy.yml --repo pomelohq/pomelo-docs --ref main
