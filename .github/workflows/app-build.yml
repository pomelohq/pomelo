name: App Build

# Reusable build for the native macOS app, shared by ci.yml (PR gate) and
# release.yml (tag publish). publish=false compiles unsigned to prove the build;
# publish=true signs, notarizes, and cuts the GitHub Release. Callers that need
# the publish path must pass `secrets: inherit`.
on:
  workflow_call:
    inputs:
      publish:
        description: Sign, notarize, and publish the DMG + Sparkle appcast (tag builds only).
        type: boolean
        default: false

jobs:
  build:
    name: Build native app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Select Xcode
        uses: ./.github/actions/setup-xcode

      - name: Go build & vet
        run: |
          go build ./...
          go vet ./...

      - name: Compile app (unsigned gate)
        if: ${{ !inputs.publish }}
        run: bash desktop/PomeloApp/build.sh

      - name: Import Developer ID certificate
        if: ${{ inputs.publish }}
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        if: ${{ inputs.publish }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials pomelo-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID"

      - name: Write Sparkle signing key
        if: ${{ inputs.publish }}
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle_ed_key" >> "$GITHUB_ENV"

      - name: Generate release notes
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {g=1; next}
            g && /^## \[/ {exit}
            g {print}' CHANGELOG.md)
          AUTO=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body 2>/dev/null || true)
          # Curated CHANGELOG section drives the notes; the auto "What's Changed"
          # (PR list + authors + compare link) is appended. Fall back to auto alone.
          if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            { printf '%s\n' "$SECTION"; [ -n "$AUTO" ] && printf '\n---\n\n%s\n' "$AUTO"; } > "$RUNNER_TEMP/notes.md"
            APPCAST="$SECTION"
          else
            printf '%s\n' "${AUTO:-Pomelo $GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
            APPCAST="$AUTO"
          fi
          {
            echo "RELEASE_NOTES<<__POMEOF__"
            printf '%s\n' "$APPCAST"
            echo "__POMEOF__"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, package
        if: ${{ inputs.publish }}
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: pomelo-notary
        run: bash desktop/PomeloApp/package.sh

      - name: Checksums
        if: ${{ inputs.publish }}
        working-directory: desktop/PomeloApp/dist
        run: |
          VERSION=$(grep '^const version' ../../../cmd/pom/root.go | cut -d'"' -f2)
          shasum -a 256 "Pomelo-$VERSION.dmg" appcast.xml > checksums.txt

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^const version' cmd/pom/root.go | cut -d'"' -f2)
          cd desktop/PomeloApp/dist
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "Pomelo-$VERSION.dmg" appcast.xml checksums.txt \
          || gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            "Pomelo-$VERSION.dmg" appcast.xml checksums.txt

      - name: Clean up keychain
        if: ${{ always() && inputs.publish }}
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
