# Workflow actions are pinned to commit SHAs; this keeps those pins moving with each action's releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # One grouped pull request a week for compatible updates; a breaking (major) update gets its own.
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-compatible:
        update-types: [minor, patch]
