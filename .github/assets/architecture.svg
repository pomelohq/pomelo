      <path d="M0,0 L10,5 L0,10 z" fill="#7c7d87"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="420" rx="16" fill="#0d0d10"/>

  <rect x="230" y="14" width="300" height="50" rx="10" fill="#1b1c20" stroke="#33343a"/>
