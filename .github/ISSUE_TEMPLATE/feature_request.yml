name: Feature Request
description: Propose a new capability or a change to how Pomelo behaves
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
      placeholder: "In a remote window I cannot ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What Pomelo should do instead. Mockups or examples welcome.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
