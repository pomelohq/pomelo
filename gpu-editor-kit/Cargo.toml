[package]
name = "pomelo-editor-kit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform GPU-rendered code editor kit (Linux/macOS/Windows)."

[[bin]]
name = "pomelo-editor-demo"
path = "src/main.rs"

[lib]
name = "pomelo_editor_kit"
path = "src/lib.rs"
# staticlib: linked into the Swift app. rlib: used by the winit demo bin.
crate-type = ["staticlib", "rlib"]

[dependencies]
# GPU: wgpu targets Metal (macOS), Vulkan (Linux), and DX12 (Windows) from one API.
wgpu = "22"
# Cross-platform windowing/input.
winit = "0.30"
# GPU text rendering on wgpu (cosmic-text shaping + glyph atlas), the core of the editor's rendering.
glyphon = "0.6"
pollster = "0.3"
anyhow = "1"
bytemuck = "1"
# Rope text buffer: O(log n) edits/indexing, scales to large files (what real editors use).
ropey = "1.6"
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
